<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Crypto Exchange Demo</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#eeeeee;
    color:#111;
    overflow:hidden;
}

button{
    font-family:inherit;
    border:0;
    background:none;
    cursor:pointer;
}

.demo-label{
    position:fixed;
    top:8px;
    left:50%;
    transform:translateX(-50%);
    z-index:9999;
    background:#f0b90b;
    color:#111;
    padding:4px 12px;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
    letter-spacing:.5px;
}

/* PHONE */

.phone{
    width:375px;
    height:812px;
    margin:20px auto;
    background:#f7f7f7;
    border:10px solid #191919;
    border-radius:40px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 25px 60px rgba(0,0,0,.25);
}

/* STATUS */

.status{
    height:30px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:3px 15px 0;
    font-size:12px;
    font-weight:650;
}

.status-right{
    display:flex;
    align-items:center;
    gap:7px;
}

.signal{
    display:flex;
    gap:2px;
    align-items:flex-end;
}

.signal span{
    width:3px;
    background:#111;
    border-radius:2px;
}

.signal span:nth-child(1){height:4px}
.signal span:nth-child(2){height:6px}
.signal span:nth-child(3){height:8px}
.signal span:nth-child(4){height:10px}

/* CONTENT */

.content{
    flex:1;
    overflow-y:auto;
    background:#f7f7f7;
}

.content::-webkit-scrollbar{
    width:0;
}

/* HEADER */

.header{
    height:67px;
    background:#fff;
    padding:8px 13px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header-side{
    display:flex;
    align-items:center;
    gap:8px;
}

.menu{
    width:29px;
}

.menu span{
    display:block;
    height:3px;
    background:#111;
    border-radius:5px;
    margin:5px 0;
}

.headphones{
    width:27px;
    height:27px;
    position:relative;
    border:3px solid #111;
    border-bottom:0;
    border-radius:16px 16px 0 0;
}

.headphones:before,
.headphones:after{
    content:"";
    position:absolute;
    top:10px;
    width:5px;
    height:10px;
    background:#111;
    border-radius:4px;
}

.headphones:before{
    left:-5px;
}

.headphones:after{
    right:-5px;
}

/* TABS */

.switch{
    background:#f1f1f1;
    border-radius:14px;
    padding:4px;
    display:flex;
}

.switch button{
    padding:8px 14px;
    border-radius:10px;
    color:#999;
    font-size:16px;
}

.switch .selected{
    background:#fff;
    color:#111;
    font-weight:600;
    box-shadow:0 1px 5px rgba(0,0,0,.05);
}

/* ICONS */

.header-icon{
    width:27px;
    height:27px;
    object-fit:contain;
}

.notification{
    position:relative;
    font-size:27px;
}

.notification-number{
    position:absolute;
    top:-4px;
    right:-5px;
    min-width:18px;
    height:18px;
    border-radius:50%;
    background:#f0b90b;
    font-size:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:700;
}

/* SEARCH */

.search{
    padding:8px 15px 13px;
    background:#fff;
}

.search-box{
    height:45px;
    border-radius:12px;
    background:#f5f5f5;
    display:flex;
    align-items:center;
    padding:0 12px;
    gap:8px;
}

.search-glass{
    font-size:28px;
    color:#999;
}

.search-input{
    flex:1;
    border:0;
    outline:none;
    background:none;
    font-size:15px;
    color:#888;
}

.scan{
    font-size:25px;
    color:#888;
}

/* BALANCE */

.balance{
    background:#fff;
    padding:14px 16px 19px;
}

.balance-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.balance-title{
    font-size:16px;
}

.balance-title span{
    margin-left:5px;
    font-size:16px;
}

.add{
    background:#fcd535;
    border-radius:7px;
    padding:12px 17px;
    font-size:15px;
    font-weight:700;
    text-decoration:underline;
}

.balance-value{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:7px;
}

.balance-number{
    font-size:28px;
    font-weight:650;
    letter-spacing:-.5px;
}

.balance-unit{
    font-size:15px;
    color:#555;
}

.eye{
    color:#777;
    font-size:20px;
}

/* QUICK ACTIONS */

.quick{
    background:#fff;
    padding:7px 13px 18px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.quick-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    color:#555;
    font-size:13px;
}

.quick-box{
    width:66px;
    height:66px;
    border-radius:16px;
    background:#fff;
    border:1px solid #f1f1f1;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
    display:flex;
    justify-content:center;
    align-items:center;
}

.quick-svg{
    width:35px;
    height:35px;
}

/* PLAY */

.card{
    background:#fff;
    margin:0 14px 12px;
    border-radius:18px;
}

.play{
    min-height:176px;
    padding:18px 16px;
    position:relative;
}

.play-heading{
    color:#999;
    font-size:16px;
    margin-bottom:18px;
}

.play-content{
    display:flex;
    align-items:center;
    gap:13px;
}

.play-icon{
    width:54px;
    height:54px;
    border:3px solid #222;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    flex-shrink:0;
}

.play-title{
    font-size:17px;
    font-weight:700;
    line-height:1.3;
}

.play-btn{
    margin-top:10px;
    background:#eee;
    padding:8px 17px;
    border-radius:7px;
    font-weight:600;
    text-decoration:underline;
}

.close{
    position:absolute;
    right:15px;
    top:16px;
    font-size:28px;
    color:#999;
}

/* TWO CARDS */

.two{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:0 14px 12px;
}

.small-card{
    background:#fff;
    min-height:255px;
    border-radius:18px;
    padding:17px;
}

.small-heading{
    color:#999;
    font-size:16px;
    margin-bottom:15px;
}

/* CRYPTO */

.coin-row{
    display:flex;
    align-items:center;
    margin-bottom:20px;
}

.coin-logo{
    width:32px;
    height:32px;
    object-fit:contain;
}

.coin-overlap{
    margin-left:-6px;
}

.usd{
    width:32px;
    height:32px;
    margin-left:-6px;
    border-radius:50%;
    background:#111;
    color:#fff;
    border:2px solid #fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:17px;
}

.buy{
    color:#20b985;
    font-size:14px;
    margin-bottom:9px;
}

.wallet-name{
    font-size:17px;
    font-weight:600;
}

.wallet{
    width:28px;
    height:20px;
    border:2px solid #333;
    border-radius:4px;
    opacity:.45;
    margin-top:27px;
}

/* RECURRING */

.recurring{
    position:relative;
}

.recurring-top{
    display:flex;
    justify-content:space-between;
    color:#999;
    font-size:16px;
}

.arrow{
    font-size:25px;
}

.plan{
    margin-top:29px;
}

.plan-title{
    font-size:15px;
    font-weight:600;
    line-height:1.4;
}

.recommend{
    display:inline-block;
    margin-top:13px;
    background:#fff5cf;
    color:#d5b000;
    padding:5px 8px;
    border-radius:5px;
    font-size:10px;
    font-weight:600;
}

.roi{
    margin-top:10px;
}

.roi-value{
    color:#e64d63;
    font-size:20px;
    font-weight:700;
}

.roi-label{
    color:#aaa;
    font-size:12px;
    margin-top:3px;
}

.btc{
    position:absolute;
    width:38px;
    height:38px;
    object-fit:contain;
    right:16px;
    bottom:17px;
}

/* EARN / RECEIVE */

.bottom-cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:0 14px 15px;
}

.info{
    background:#fff;
    border-radius:18px;
    min-height:170px;
    padding:17px;
}

.info-head{
    display:flex;
    justify-content:space-between;
    color:#999;
    font-size:16px;
    margin-bottom:23px;
}

.eth-row{
    display:flex;
    align-items:center;
    gap:11px;
}

.eth{
    width:43px;
    height:43px;
    object-fit:contain;
}

.coin-name{
    font-size:16px;
    font-weight:600;
}

.apr{
    margin-top:4px;
    color:#999;
    font-size:13px;
}

.receive{
    font-size:15px;
    font-weight:600;
    line-height:1.4;
}

/* BOTTOM SHEET */

.bottom{
    height:112px;
    background:#fff;
    border-top:1px solid #eee;
    padding-top:10px;
}

.feed{
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:0 8px 10px;
}

.feed button{
    color:#777;
    font-size:14px;
}

.feed .active{
    color:#111;
    font-weight:600;
    text-decoration:underline;
}

/* EXACT-STYLE BOTTOM NAV */

.nav{
    height:61px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
}

.nav-item{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:3px;
    color:#555;
    font-size:11px;
}

.nav-item.active{
    background:#e9e9e9;
    border-radius:10px;
    margin:0 4px;
    color:#111;
    font-weight:600;
}

.nav-icon{
    width:27px;
    height:27px;
}

/* RESPONSIVE */

@media(max-width:500px){

    body{
        background:#fff;
    }

    .demo-label{
        display:none;
    }

    .phone{
        width:100%;
        height:100vh;
        margin:0;
        border:0;
        border-radius:0;
        box-shadow:none;
    }
}
</style>
</head>

<script>

/* Exchange / Wallet */

document.querySelectorAll(".switch button").forEach(button=>{

    button.addEventListener("click",()=>{

        document.querySelectorAll(".switch button")
        .forEach(item=>item.classList.remove("selected"));

        button.classList.add("selected");

    });

});


/* Bottom navigation */

document.querySelectorAll(".nav-item").forEach(button=>{

    button.addEventListener("click",()=>{

        document.querySelectorAll(".nav-item")
        .forEach(item=>item.classList.remove("active"));

        button.classList.add("active");

    });

});


/* Feed navigation */

document.querySelectorAll(".feed button").forEach(button=>{

    button.addEventListener("click",()=>{

        document.querySelectorAll(".feed button")
        .forEach(item=>item.classList.remove("active"));

        button.classList.add("active");

    });

});


/* Close Play & Predict */

document.querySelector(".close").addEventListener("click",()=>{

    document.querySelector(".play").style.display="none";

});

});
