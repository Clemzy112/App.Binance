<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Binance Exchange</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
    "Helvetica Neue",Arial,sans-serif;
    background:#ededed;
    color:#161616;
    overflow:hidden;
}

button{
    font-family:inherit;
    cursor:pointer;
}

/* PHONE */

.phone-container{
    width:375px;
    height:812px;
    margin:20px auto;
    background:#fff;
    border:10px solid #191919;
    border-radius:40px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 25px 60px rgba(0,0,0,.25);
}

/* STATUS BAR */

.status-bar{
    height:31px;
    padding:5px 15px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#fff;
    font-size:12px;
    font-weight:600;
}

.status-right{
    display:flex;
    align-items:center;
    gap:7px;
}

.signal{
    display:flex;
    gap:2px;
    align-items:flex-end;
}

.signal span{
    width:3px;
    background:#111;
    border-radius:2px;
}

.signal span:nth-child(1){height:4px}
.signal span:nth-child(2){height:6px}
.signal span:nth-child(3){height:8px}
.signal span:nth-child(4){height:10px}

/* MAIN */

.main-content{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    background:#f7f7f7;
}

.main-content::-webkit-scrollbar{
    width:0;
}

/* HEADER */

.header{
    height:67px;
    padding:8px 13px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#fff;
}

.header-left,
.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.header-btn{
    border:0;
    background:transparent;
    width:35px;
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* Binance official PNG */

.binance-logo{
    width:29px;
    height:29px;
    object-fit:contain;
    display:block;
}

/* MENU */

.menu{
    width:28px;
}

.menu span{
    display:block;
    height:3px;
    margin:5px 0;
    background:#111;
    border-radius:5px;
}

/* HEADPHONE */

.headphone{
    width:25px;
    height:25px;
    border:3px solid #111;
    border-bottom:0;
    border-radius:15px 15px 0 0;
    position:relative;
}

.headphone:before,
.headphone:after{
    content:"";
    position:absolute;
    width:5px;
    height:10px;
    background:#111;
    top:10px;
    border-radius:4px;
}

.headphone:before{
    left:-5px;
}

.headphone:after{
    right:-5px;
}

/* EXCHANGE WALLET */

.nav-tabs{
    background:#f1f1f1;
    padding:4px;
    border-radius:14px;
    display:flex;
}

.nav-tab{
    border:0;
    background:transparent;
    padding:8px 13px;
    border-radius:10px;
    font-size:16px;
    color:#999;
}

.nav-tab.active{
    background:#fff;
    color:#111;
    font-weight:600;
    box-shadow:0 1px 5px rgba(0,0,0,.06);
}

/* TOP ICON */

.header-symbol{
    font-size:26px;
    line-height:1;
}

.notification{
    position:relative;
}

.badge{
    position:absolute;
    top:-3px;
    right:-3px;
    min-width:18px;
    height:18px;
    padding:0 4px;
    border-radius:50%;
    background:#f5c400;
    font-size:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:700;
}

/* SEARCH */

.search-container{
    padding:8px 15px 13px;
    background:#fff;
}

.search-bar{
    height:45px;
    border-radius:12px;
    background:#f5f5f5;
    display:flex;
    align-items:center;
    padding:0 12px;
    gap:8px;
}

.search-icon{
    font-size:27px;
    color:#999;
    line-height:1;
}

.fire{
    font-size:19px;
}

.search-input{
    flex:1;
    border:0;
    outline:0;
    background:transparent;
    color:#888;
    font-size:15px;
}

.scan{
    color:#888;
    font-size:23px;
}

/* VALUE */

.value-section{
    background:#fff;
    padding:14px 16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.value-label{
    font-size:16px;
}

.value-arrow{
    margin-left:4px;
    font-size:17px;
}

.add-funds{
    border:0;
    background:#fcd535;
    color:#111;
    padding:12px 17px;
    border-radius:7px;
    font-size:15px;
    font-weight:700;
    text-decoration:underline;
}

/* QUICK ACTIONS */

.quick-actions{
    background:#fff;
    padding:7px 13px 18px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.action{
    border:0;
    background:transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    color:#555;
    font-size:13px;
}

.action-box{
    width:66px;
    height:66px;
    background:#fff;
    border-radius:16px;
    border:1px solid #f1f1f1;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
    display:flex;
    align-items:center;
    justify-content:center;
}

.action-svg{
    width:34px;
    height:34px;
}

/* PLAY CARD */

.card{
    background:#fff;
    margin:0 14px 12px;
    border-radius:18px;
}

.play-card{
    min-height:176px;
    padding:18px 16px;
    position:relative;
}

.play-heading{
    color:#999;
    font-size:16px;
    margin-bottom:18px;
}

.play-content{
    display:flex;
    align-items:center;
    gap:13px;
}

.play-icon{
    width:53px;
    height:53px;
    border:3px solid #252525;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:27px;
    flex-shrink:0;
}

.play-title{
    font-size:17px;
    font-weight:700;
    line-height:1.3;
}

.play-button{
    margin-top:11px;
    padding:8px 17px;
    border:0;
    border-radius:7px;
    background:#eee;
    font-weight:600;
    text-decoration:underline;
}

.close{
    position:absolute;
    top:18px;
    right:15px;
    border:0;
    background:transparent;
    font-size:28px;
    color:#999;
}

/* TWO CARDS */

.two-column{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:0 14px 12px;
}

.column-card{
    background:#fff;
    border-radius:18px;
    min-height:252px;
    padding:17px;
}

.small-title{
    font-size:16px;
    color:#999;
    margin-bottom:15px;
}

/* CRYPTO LOGOS */

.crypto-pair{
    display:flex;
    align-items:center;
    margin-bottom:20px;
}

.crypto-logo{
    width:31px;
    height:31px;
    object-fit:contain;
}

.crypto-logo.overlap{
    margin-left:-6px;
}

/* USD */

.usd-logo{
    width:31px;
    height:31px;
    border-radius:50%;
    background:#111;
    color:#fff;
    border:2px solid #fff;
    margin-left:-6px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
}

/* FIAT */

.buy{
    color:#20b985;
    font-size:14px;
    margin-bottom:9px;
}

.wallet-name{
    font-size:17px;
    font-weight:600;
}

.wallet-icon{
    margin-top:27px;
    width:26px;
    height:20px;
    border:2px solid #333;
    border-radius:4px;
    opacity:.45;
    position:relative;
}

.wallet-icon:after{
    content:"";
    position:absolute;
    width:9px;
    height:5px;
    border:2px solid #333;
    border-radius:2px;
    right:-2px;
    top:5px;
}

/* RECURRING */

.recurring{
    position:relative;
}

.recurring-header{
    display:flex;
    justify-content:space-between;
    color:#999;
    font-size:16px;
}

.arrow{
    font-size:26px;
    line-height:16px;
}

.btc-plan{
    margin-top:29px;
}

.btc-plan-title{
    font-size:15px;
    line-height:1.4;
    font-weight:600;
}

.recommend{
    display:inline-block;
    margin-top:14px;
    padding:5px 8px;
    background:#fff5cf;
    color:#d7b300;
    border-radius:5px;
    font-size:10px;
    font-weight:600;
}

.roi{
    margin-top:10px;
}

.roi-value{
    font-size:20px;
    color:#e54c62;
    font-weight:700;
}

.roi-label{
    color:#aaa;
    font-size:12px;
    margin-top:3px;
}

.btc-logo{
    position:absolute;
    width:37px;
    height:37px;
    right:16px;
    bottom:17px;
    object-fit:contain;
}

/* EARN RECEIVE */

.bottom-cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:0 14px 15px;
}

.info-card{
    background:#fff;
    border-radius:18px;
    min-height:170px;
    padding:17px;
}

.info-header{
    display:flex;
    justify-content:space-between;
    color:#999;
    font-size:16px;
    margin-bottom:23px;
}

.eth-row{
    display:flex;
    align-items:center;
    gap:11px;
}

.eth-logo{
    width:43px;
    height:43px;
    object-fit:contain;
}

.coin-name{
    font-size:16px;
    font-weight:600;
}

.apr{
    color:#999;
    font-size:13px;
    margin-top:4px;
}

.receive-title{
    font-size:15px;
    line-height:1.4;
    font-weight:600;
}

/* BOTTOM NAV */

.bottom-nav{
    height:112px;
    background:#fff;
    border-top:1px solid #eee;
    padding-top:10px;
}

.feed-tabs{
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:0 8px 11px;
}

.feed-tab{
    border:0;
    background:transparent;
    color:#777;
    font-size:14px;
}

.feed-tab.active{
    color:#111;
    font-weight:600;
    text-decoration:underline;
}

.bottom-icons{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    height:59px;
}

.bottom-item{
    border:0;
    background:transparent;
    color:#555;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    font-size:11px;
}

.bottom-item.active{
    background:#ededed;
    border-radius:10px;
    margin:0 4px;
    color:#111;
    font-weight:600;
}

.bottom-logo{
    width:25px;
    height:25px;
    object-fit:contain;
}

/* MOBILE */

@media(max-width:500px){

    body{
        background:#fff;
    }

    .phone-container{
        width:100%;
        height:100vh;
        margin:0;
        border:0;
        border-radius:0;
        box-shadow:none;
    }
}
</style>

<script>

/* EXCHANGE / WALLET */

document.querySelectorAll(".nav-tab").forEach(button=>{

    button.addEventListener("click",()=>{

        document
        .querySelectorAll(".nav-tab")
        .forEach(item=>{
            item.classList.remove("active");
        });

        button.classList.add("active");

    });

});


/* DISCOVER TABS */

document.querySelectorAll(".feed-tab").forEach(button=>{

    button.addEventListener("click",()=>{

        document
        .querySelectorAll(".feed-tab")
        .forEach(item=>{
            item.classList.remove("active");
        });

        button.classList.add("active");

    });

});


/* BOTTOM NAV */

document.querySelectorAll(".bottom-item").forEach(button=>{

    button.addEventListener("click",()=>{

        document
        .querySelectorAll(".bottom-item")
        .forEach(item=>{
            item.classList.remove("active");
        });

        button.classList.add("active");

    });

});


/* CLOSE PLAY CARD */

document.querySelector(".close").addEventListener("click",()=>{

    document.querySelector(".play-card").style.display="none";

});


/* ADD FUNDS */

document.querySelector(".add-funds").addEventListener("click",()=>{

    alert("Add Funds selected");

});

</script>
